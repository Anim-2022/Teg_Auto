# fly.toml app configuration file generated for teg-auto on 2026-05-16T11:32:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teg-auto'
primary_region = 'fra'

[build]

[env]
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
