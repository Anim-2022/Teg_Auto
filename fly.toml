# fly.toml app configuration file generated for teg-auto on 2026-05-16T11:32:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'teg-auto'
primary_region = 'fra'

[build]

[env]
  PYTHONUNBUFFERED = '1'

# No [http_service] — this is a polling bot, not a web server

# Explicit process keeps machine alive as long as the script runs
[processes]
  app = "python main.py"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
